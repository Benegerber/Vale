  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

style=\"display:flex;gap:clamp(12px,2.2vw,26px);align-items:center;flex-wrap:wrap;font-size:14.5px;font-weight:500\">\n    <a href=\"eventmoderation.html\" style=\"text-decoration:none;color:oklch(0.34 0.03 40)\" style-hover=\"color:oklch(0.45 0.1 138)\">Eventmoderatorin<\u002Fa>\n    <a href=\"traurednerin.html\" style=\"text-decoration:none;color:oklch(0.34 0.03 40)\" style-hover=\"color:oklch(0.45 0.1 138)\">Traurednerin<\u002Fa>\n    <a href=\"vorlesespitex.html\" style=\"text-decoration:none;color:oklch(0.42 0.1 138);font-weight:700\">Vorlesespitex<\u002Fa>\n    <a href=\"ueber-mich.html\" style=\"text-decoration:none;color:oklch(0.34 0.03 40)\" style-hover=\"color:oklch(0.45 0.1 138)\">Über mich<\u002Fa>\n    <a href=\"index.html?goto=kontakt#kontakt\" style=\"text-decoration:none;background:oklch(0.45 0.1 138);color:oklch(0.98 0.012 78);padding:11px 22px;border-radius:100px;font-weight:600\" style-hover=\"background:oklch(0.38 0.09 138)\">Kontakt<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<section style=\"padding:clamp(18px,3vw,34px) clamp(14px,3vw,40px) 0\">\n  <div style=\"max-width:1200px;margin:0 auto;width:100%;height:clamp(280px,40vw,470px);border-radius:24px;overflow:hidden;background:oklch(0.9 0.02 78)\">\n    <image-slot id=\"vorlesespitex-foto\" shape=\"rect\" placeholder=\"Foto: Vorlesespitex\" src=\"784a7cc4-b93a-4f68-a0b3-1cfcfdb6ca88\"><\u002Fimage-slot>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(34px,5vw,56px) clamp(18px,4vw,56px) 0\">\n  <div style=\"max-width:1200px;margin:0 auto\">\n    <div style=\"display:grid;justify-items:start;gap:20px;margin-bottom:18px\">\n      <a href=\"index.html#angebote\" style=\"font-size:14px;color:oklch(0.5 0.03 40);text-decoration:none;font-weight:500\">← Zur Startseite<\u002Fa>\n      <p style=\"display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;color:oklch(0.42 0.1 138);background:oklch(0.62 0.11 135 / 0.14);padding:9px 18px;border-radius:100px;margin:0\">Angebot<\u002Fp>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:500;letter-spacing:-0.03em;font-size:clamp(32px,5.6vw,68px);line-height:0.98;margin:0 0 20px;text-wrap:pretty;animation:vbRise 0.8s ease-out both\">Vorlesespitex<\u002Fh1>\n    <p style=\"font-size:clamp(17px,1.9vw,22px);line-height:1.62;color:oklch(0.4 0.03 40);margin:0;max-width:44ch\">Vorlesen für Menschen in Pflegesituationen: Nähe durch Geschichten und gute Gespräche.<\u002Fp>\n    <div style=\"height:2px;background:oklch(0.72 0.1 135);margin-top:clamp(28px,4vw,48px);transform-origin:left;animation:vbGrow 1.1s 0.2s cubic-bezier(0.2,0.7,0.2,1) both\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(34px,5vw,56px) clamp(18px,4vw,56px) clamp(44px,6vw,76px)\">\n  <div style=\"max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(28px,4.5vw,64px);align-items:center\">\n    <div style=\"width:100%;aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:oklch(0.9 0.02 78)\">\n      <image-slot id=\"vorlesespitex-intro-foto\" shape=\"rect\" placeholder=\"Foto: Vorlesen\" src=\"f3716b72-c6d7-4d1a-82af-95682e79db88\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <p style=\"font-size:clamp(17px,1.75vw,19.5px);line-height:1.82;color:oklch(0.3 0.03 40);margin:0;text-wrap:pretty\">Ich lese persönlich vor für Personen, die gesundheitlich oder körperlich nicht mehr dazu in der Lage sind oder einfach Freude an Begegnung und Literatur haben. Damit möchte die ich Einsamkeit lindern und für soziale und kulturelle Inklusion sorgen. Ob Buch, Zeitung oder Gedichte – was ich vorlese, entscheiden Sie!<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(32px,4.2vw,52px) clamp(18px,4vw,56px)\">\n  <div style=\"max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(24px,3.4vw,44px);align-items:start\">\n    <div>\n      <p style=\"font-size:12.5px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;color:oklch(0.56 0.12 95);margin:0 0 14px\">Für wen<\u002Fp>\n      <h3 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:500;letter-spacing:-0.025em;font-size:clamp(20px,2.2vw,26px);line-height:1.16;margin:0;text-wrap:pretty\">Junge und ältere Personen in Pflegesituationen zu Hause<\u002Fh3>\n      <p style=\"font-size:clamp(16px,1.65vw,18px);line-height:1.76;color:oklch(0.4 0.03 40);margin:16px 0 0;text-wrap:pretty\">Pflegen Sie jemanden zu Hause? Ich komme vorbei und lese für Menschen in privaten Pflegesituationen, die sozial und kulturell isoliert sind vor. Auch in palliativen Situationen.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <p style=\"font-size:12.5px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;color:oklch(0.56 0.12 95);margin:0 0 14px\">Institutionen<\u002Fp>\n      <h3 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:500;letter-spacing:-0.025em;font-size:clamp(20px,2.2vw,26px);line-height:1.16;margin:0;text-wrap:pretty\">Pflegeheime, Spitäler, Spitex-Organisationen und Hospize<\u002Fh3>\n      <ul style=\"list-style:none;margin:16px 0 0;padding:0;display:grid;gap:9px;font-size:clamp(16px,1.65vw,18px);line-height:1.5;color:oklch(0.34 0.03 40)\">\n        <li style=\"display:flex;gap:12px\"><span style=\"color:oklch(0.76 0.15 98);flex:none\">—<\u002Fspan><span>Vorlesen in den Pflegeheim- oder Spitalzimmern der Pflegebedürftigen.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span style=\"color:oklch(0.76 0.15 98);flex:none\">—<\u002Fspan><span>Vorlesen für Menschen mit Demenz oder auf Palliativ- oder Intensivstationen.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:oklch(0.62 0.11 135 / 0.11);padding:clamp(52px,7vw,92px) clamp(18px,4vw,56px)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:500;letter-spacing:-0.025em;font-size:clamp(27px,4.2vw,46px);margin:0 0 clamp(30px,4vw,48px);text-align:center\">Wie können Sie mich buchen?<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(20px,3vw,30px)\">\n      <sc-for list=\"{{ steps }}\" as=\"step\" hint-placeholder-count=\"3\">\n        <div style=\"background:oklch(0.985 0.014 78);border-radius:22px;padding:clamp(24px,2.8vw,34px);display:flex;flex-direction:column;gap:13px;box-shadow:0 2px 10px oklch(0.3 0.04 150 / 0.06)\">\n          <span style=\"width:46px;height:46px;border-radius:50%;background:oklch(0.62 0.11 135 / 0.16);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-size:25px;color:oklch(0.42 0.1 138);line-height:1\">{{ step.n }}<\u002Fspan>\n          <h3 style=\"margin:0;font-size:19px;font-weight:700;line-height:1.3\">{{ step.title }}<\u002Fh3>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.68;color:oklch(0.44 0.03 40)\">{{ step.text }}<\u002Fp>\n          <sc-if value=\"{{ step.showKontakt }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:15.5px;line-height:1.68;color:oklch(0.44 0.03 40)\"><a href=\"index.html?goto=kontakt#kontakt\" style=\"color:oklch(0.42 0.1 138);text-decoration:none;border-bottom:1px solid oklch(0.42 0.1 138 / 0.4)\" style-hover=\"border-color:oklch(0.42 0.1 138)\">Zum Kontaktformular<\u002Fa><\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ step.showKonditionen }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:15.5px;line-height:1.68;color:oklch(0.44 0.03 40)\">Genauere Angaben zu meinen Konditionen finden Sie <a href=\"#konditionen\" style=\"color:oklch(0.42 0.1 138);text-decoration:none;border-bottom:1px solid oklch(0.42 0.1 138 / 0.4)\" style-hover=\"border-color:oklch(0.42 0.1 138)\">hier<\u002Fa>.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"konditionen\" style=\"padding:clamp(32px,4.2vw,52px) clamp(18px,4vw,56px);scroll-margin-top:90px\">\n  <div style=\"max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(20px,2.8vw,36px);align-items:start\">\n    <div>\n      <p style=\"font-size:12.5px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;color:oklch(0.56 0.12 95);margin:0 0 14px\">Konditionen<\u002Fp>\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:500;letter-spacing:-0.025em;font-size:clamp(22px,2.6vw,32px);line-height:1.08;margin:0;white-space:nowrap\">Und was kostet das?<\u002Fh2>\n      <p style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:clamp(19px,2.1vw,25px);line-height:1.26;letter-spacing:-0.02em;color:oklch(0.38 0.1 138);margin:18px 0 0;text-wrap:pretty\">60 Minuten Vorlesezeit: CHF 50<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:clamp(20px,2.6vw,28px)\">\n      <div>\n        <p style=\"font-size:clamp(9.5px,1.05vw,12.5px);letter-spacing:0.14em;white-space:nowrap;text-transform:uppercase;font-weight:700;color:oklch(0.56 0.12 95);margin:0 0 14px\">Weitere Zeitfenster<\u002Fp>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:clamp(16px,1.65vw,18px);line-height:1.5;color:oklch(0.34 0.03 40)\">\n          <li style=\"display:flex;gap:12px\"><span style=\"color:oklch(0.76 0.15 98);flex:none\">—<\u002Fspan><span>30 Minuten: CHF 30<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px\"><span style=\"color:oklch(0.76 0.15 98);flex:none\">—<\u002Fspan><span>90 Minuten: CHF 70<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px\"><span style=\"color:oklch(0.76 0.15 98);flex:none\">—<\u002Fspan><span>5er-Abo à 60 Minuten: CHF 225 (Sie sparen CHF 25)<\u002Fspan><\u002Fli>\n        <\u002Ful>\n        <p style=\"font-size:clamp(15.5px,1.6vw,17px);line-height:1.7;color:oklch(0.45 0.03 40);margin:16px 0 0;text-wrap:pretty\">Je nach Distanz kommt eine Anreisepauschale dazu, die ich Ihnen vorab transparent mitteile.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:12.5px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;color:oklch(0.56 0.12 95);margin:0 0 14px\">Für Heime und Institutionen<\u002Fp>\n        <p style=\"font-size:clamp(16.5px,1.7vw,19px);line-height:1.78;color:oklch(0.4 0.03 40);margin:0;text-wrap:pretty\">Sie möchten regelmässige Vorlesestunden für mehrere Bewohnerinnen und Bewohner oder für eine Gruppe? Dann erstelle ich Ihnen gerne eine individuelle Offerte, abgestimmt auf Ihre Organisation und die Bedürfnisse der Menschen in Ihrer Pflege.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section style=\"padding:clamp(40px,5.2vw,64px) 24px;text-align:center\">\n  <a href=\"index.html?goto=kontakt#kontakt\" style=\"display:inline-block;background:oklch(0.45 0.1 138);color:oklch(0.98 0.012 78);padding:17px 40px;border-radius:100px;font-weight:700;font-size:16px;text-decoration:none\" style-hover=\"background:oklch(0.38 0.09 138)\">Jetzt Kontakt aufnehmen<\u002Fa>\n<\u002Fsection>\n\n<footer style=\"background:oklch(0.25 0.01 265);color:oklch(0.87 0.02 78);padding:clamp(42px,6vw,72px) clamp(18px,4vw,56px) 26px\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:30px clamp(24px,3vw,40px);max-width:1240px;margin:0 auto;align-items:flex-start\">\n    <div style=\"flex:1.4 1 200px;min-width:0\">\n      <p style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:26px;margin:0 0 8px;color:oklch(0.97 0.012 78)\">Valeria Blum<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.5;color:oklch(0.87 0.02 78);margin:14px 0 0\">Fotografien by <span style=\"font-family:'Bricolage Grotesque',sans-se d oklch(0.38 0.012 265);padding-top:18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px\"><p style=\"margin:0\">© 2026 Valeria Blum, Eventmoderatorin, Traurednerin &amp; Vorlesespitex<\u002Fp><\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { openIndex: 0, navOpen: false };\n\n  toggleNav = () => this.setState(s => ({ navOpen: !s.navOpen }));\n\n  faqs = [\n    { q: 'Für wen eignet sich die Vorlesespitex?', a: 'Für Menschen, die selbst nicht mehr lesen können oder möchten, zu Hause, im Heim oder in der Tagesstätte.' },\n    { q: 'Wie oft finden die Vorlesebegegnungen statt?', a: 'Das ist ganz nach Wunsch, von einmaligen Terminen bis zu regelmässigen wöchentlichen Besuchen.' },\n    { q: 'Kann ich als Organisation die Vorlesespitex ausprobieren?', a: 'Gerne stelle ich das Angebot persönlich vor Ort vor, unverbindlich und ohne Kosten.' },\n    { q: 'Was wird vorgelesen?', a: 'Das entscheiden die Vorlieben der vorlesenden Person, von Kurzgeschichten über Gedichte bis zu Zeitungsartikeln.' }\n  ];\n\n  steps = [\n    { n: '1', title: 'Sie kontaktieren mich', text: 'Nehmen Sie über meine Webseite, telefonisch oder per E-Mail Kontakt mit mir auf. Gerne stelle ich die Vorlesespitex auch persönlich in Ihrer Organisation vor.' , showKontakt: true },\n    { n: '2', title: 'Angebot', text: 'Entsprechend Ihren Wünschen und Bedürfnissen der Personen in Pflege unterbreite ich eine passende Offerte.', showKonditionen: true },\n    { n: '3', title: 'Vorbereitung', text: 'Wir klären die restlichen Details, koordinieren die Termine und sorgen für eine gemütliche Vorlesebegegnung.' }\n  ];\n\n  toggle = (i) => this.setState(s => ({ openIndex: s.openIndex === i ? -1 : i }));\n\n  renderVals() {\n    return {\n      navOpen: this.state.navOpen ? '1' : '0',\n      toggleNav: this.toggleNav,\n      steps: this.steps,\n      faqItems: this.faqs.map((f, i) => ({\n        q: f.q, a: f.a,\n        isOpen: this.state.openIndex === i,\n        icon: this.state.openIndex === i ? '−' : '+',\n        onClick: () => this.toggle(i)\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
